# Example stagbru config file — TOML equivalent of configs/config.yaml.
# See that file for the full explanation of what this is for and how
# STAGBRU_CONFIG loads it; this file just mirrors its content in TOML.

HTTP_ADDR = ":9090"
TS_LOGIN_SERVER = "https://headscale.example.invalid"
TS_STATE_DIR = "/var/lib/tailscale"
TS_HOSTNAME = "stagbru-gateway"
TS_ROUTES = "172.16.6.0/24,100.192.8.0/24"

[[wg.networks]]
name = "default"
interface = "wg0"
listen_port = 51820
self_secret = "gateway-self"
self_name = "wg-node-name"
masquerade = true
advertise_to_tailscale = true

# One or more typed sources, unioned into one desired peer set (see
# pkg/peers). "kubernetes_secret" (Secret in this pod's own namespace, key
# peers.json, via an informer) is the only implemented type today; "openbao"
# (poll OpenBao's KV v2 API directly, no Kubernetes Secret hop) is accepted
# and validated but not yet runnable — see pkg/peers/doc.go.
[[wg.networks.peers_sources]]
type = "kubernetes_secret"
secret_name = "wg0-conf"

